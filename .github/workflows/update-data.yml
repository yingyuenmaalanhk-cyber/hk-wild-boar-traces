name: Update data

# Scheduled refresh: fetch the latest AFCD publication and the published
# community-reports CSV, rebuild the static datasets, and push them if (and
# only if) something changed. GitHub Pages then redeploys automatically.
# Also runs on demand from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 3 1 * *" # day 1 of every month, 03:00 UTC = 11:00 HKT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build datasets (AFCD + community CSV)
        env:
          COMMUNITY_SHEET_CSV_URL: ${{ vars.COMMUNITY_SHEET_CSV_URL }}
        run: |
          if [ -n "$COMMUNITY_SHEET_CSV_URL" ]; then
            python tools/prepare_data.py --require-afcd --community-url "$COMMUNITY_SHEET_CSV_URL"
          else
            python tools/prepare_data.py --require-afcd
          fi

      - name: Commit and push if data changed
        run: |
          if [ -n "$(git status --porcelain data tools/afcd_records.json tools/geocode_cache.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data tools/afcd_records.json tools/geocode_cache.json
            git commit -m "Data update: AFCD + community reports (auto)"
            git push
            echo "Changes pushed; GitHub Pages will redeploy."
          else
            echo "No data changes; nothing to commit."
          fi
