</head>
<body>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13.5c2.6 0 5 2 5 4.3 0 1.4-1.1 2.2-2.5 2.2-1 0-1.7-.5-2.5-.5s-1.5.5-2.5.5c-1.4 0-2.5-.8-2.5-2.2 0-2.3 2.4-4.3 5-4.3zM5.5 8.5c1 0 1.8 1 1.8 2.2S6.5 13 5.5 13 3.7 12 3.7 10.7s.8-2.2 1.8-2.2zm13 0c1 0 1.8 1 1.8 2.2S19.5 13 18.5 13s-1.8-1-1.8-2.3.8-2.2 1.8-2.2zM9 4.5c1.1 0 2 1.1 2 2.4S10.1 9.3 9 9.3 7 8.2 7 6.9s.9-2.4 2-2.4zm6 0c1.1 0 2 1.1 2 2.4s-.9 2.4-2 2.4-.9-1.1-.9-2.4.9-2.4 2-2.4z"/></svg>

        <span>豬絲馬跡<small>HK WILD BOAR TRACES</small></span>

        <a href="index.html" data-i18n="nav.home"></a>

        <button type="button" data-lang-btn="zh" aria-pressed="true" aria-label="" data-i18n-aria="a11y.lang.zh">中文</button>
        <button type="button" data-lang-btn="en" aria-pressed="false" aria-label="" data-i18n-aria="a11y.lang.en">EN</button>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-label="" data-i18n-aria="a11y.menu">
        <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>

      </button>
    </div>
  </header>

  <div class="data-banner" data-banner hidden>
    <div class="inner">
      <span aria-hidden="true">ⓘ</span>
      <span><span data-i18n="banner.snapshot"></span>: <strong data-banner-date>—</strong> · <span data-i18n="banner.source"></span>: <span data-banner-source>—</span> · <span data-i18n="banner.nonrealtime"></span></span>
      <a href="about.html#limitations" data-i18n="banner.learn"></a>
    </div>
  </div>

  <main id="main" class="map-layout">
    <aside class="map-side" aria-label="" data-i18n-aria="map.title">
      <div class="side-scroll">
        <form class="map-filters" id="filter-form">
          <h2 style="font-size: 1.05rem;" data-i18n="map.title"></h2>
          <div class="field">
            <label for="f-q" data-i18n="map.q.label"></label>
            <input type="text" id="f-q" name="q" autocomplete="off" data-i18n-placeholder="map.q.placeholder">
          </div>
          <div class="field">
            <label for="f-district" data-i18n="map.district"></label>
            <select id="f-district" name="district">
              <option value="" data-i18n="map.district.all"></option>
            </select>
          </div>
          <div class="field">
            <label for="f-level" data-i18n="map.level"></label>
            <select id="f-level" name="level">
              <option value="" data-i18n="map.level.all"></option>
              <option value="high" data-i18n="map.level.high"></option>
              <option value="medium" data-i18n="map.level.medium"></option>
              <option value="low" data-i18n="map.level.low"></option>
              <option value="past" data-i18n="map.level.past"></option>
            </select>
          </div>
          <fieldset class="field" style="border: 0; padding: 0; margin: 0 0 14px;">
            <legend data-i18n="map.date"></legend>
            <div class="field-row">
              <input type="date" id="f-from" name="from" aria-label="" data-i18n-aria="map.date.from">
              <input type="date" id="f-to" name="to" aria-label="" data-i18n-aria="map.date.to">
            </div>
          </fieldset>
          <div class="field">
            <label for="f-min-count" data-i18n="map.mincount"></label>
            <input type="number" id="f-min-count" name="min_count" min="1" inputmode="numeric" data-i18n-placeholder="map.mincount.placeholder">
          </div>
          <div class="filter-actions">
            <button type="button" class="btn btn-outline btn-sm" id="btn-reset" data-i18n="map.reset"></button>
          </div>
          <p style="font-size: 0.78rem; color: var(--c-ink-faint); margin: 0 0 10px;" data-i18n="map.readonly_note"></p>
        </form>
        <div style="padding: 0 18px;">
          <div class="note" style="font-size: 0.82rem; padding: 10px 12px;" data-i18n="map.mark_note"></div>
        </div>
        <div class="results-count" role="status" aria-live="polite" data-results-count></div>
        <ul class="result-list" data-result-list aria-label="" data-i18n-aria="map.list.label"></ul>
      </div>
    </aside>

    <section class="map-stage" aria-label="" data-i18n-aria="nav.map">
      <div id="map" tabindex="-1"></div>
      <div class="map-legend">
        <h3 data-i18n="map.legend.title"></h3>
        <ul data-legend></ul>
      </div>
    </section>
  </main>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="assets/vendor/leaflet/leaflet-heat.js"></script>
  <script type="module" src="assets/js/map.js"></script>
</body>
</html>
