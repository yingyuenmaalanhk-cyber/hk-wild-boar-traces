  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">
        <span class="logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13.5c2.6 0 5 2 5 4.3 0 1.4-1.1 2.2-2.5 2.2-1 0-1.7-.5-2.5-.5s-1.5.5-2.5.5c-1.4 0-2.5-.8-2.5-2.2 0-2.3 2.4-4.3 5-4.3zM5.5 8.5c1 0 1.8 1 1.8 2.2S6.5 13 5.5 13 3.7 12 3.7 10.7s.8-2.2 1.8-2.2zm13 0c1 0 1.8 1 1.8 2.2S19.5 13 18.5 13s-1.8-1-1.8-2.3.8-2.2 1.8-2.2zM9 4.5c1.1 0 2 1.1 2 2.4S10.1 9.3 9 9.3 7 8.2 7 6.9s.9-2.4 2-2.4zm6 0c1.1 0 2 1.1 2 2.4s-.9 2.4-2 2.4-.9-1.1-.9-2.4.9-2.4 2-2.4z"/></svg>
        </span>
        <span>豬絲馬跡<small>HK WILD BOAR TRACES</small></span>

      </div>
      <button class="nav-toggle" aria-expanded="false" aria-label="" data-i18n-aria="a11y.menu">
        <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>

  <div class="data-banner" data-banner hidden>
    <div class="inner">
      <span aria-hidden="true">ⓘ</span>
      <span><span data-i18n="banner.snapshot"></span>: <strong data-banner-date>—</strong> · <span data-i18n="banner.source"></span>: <span data-banner-source>—</span> · <span data-i18n="banner.nonrealtime"></span></span>
      <a href="about.html#limitations" data-i18n="banner.learn"></a>
    </div>

  <main id="main" class="section">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Data &amp; Analytics</span>
        <h2 data-i18n="nav.analytics"></h2>
        <p data-i18n="analytics.subtitle"></p>
      </div>

      <form class="card filter-bar" id="filter-form" aria-label="" data-i18n-aria="map.title">
        <div class="field">
          <label for="a-from" data-i18n="analytics.from"></label>
          <input type="date" id="a-from" name="from">
        </div>
        <div class="field">
          <label for="a-to" data-i18n="analytics.to"></label>
          <input type="date" id="a-to" name="to">
        </div>
        <div class="field">
          <label for="a-district" data-i18n="analytics.district"></label>
          <select id="a-district" name="district">
            <option value="" data-i18n="map.district.all"></option>
          </select>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="a-reset" data-i18n="analytics.reset"></button>
        <a class="btn btn-outline btn-sm" id="a-map-link" href="map.html" data-i18n="analytics.viewmap"></a>
      </form>

      <div class="stat-strip" style="margin-bottom: 26px;" data-summary>
        <div class="card stat-tile"><div class="num" data-sum="records">—</div><div class="lbl" data-i18n="analytics.sum.records"></div><div class="sub" data-i18n="analytics.sum.records_sub"></div></div>
        <div class="card stat-tile"><div class="num" data-sum="boars">—</div><div class="lbl" data-i18n="analytics.sum.boars"></div><div class="sub" data-i18n="analytics.sum.boars_sub"></div></div>
        <div class="card stat-tile"><div class="num" data-sum="locations">—</div><div class="lbl" data-i18n="analytics.sum.locations"></div><div class="sub" data-i18n="analytics.sum.locations_sub"></div></div>
        <div class="card stat-tile"><div class="num" data-sum="avg">—</div><div class="lbl" data-i18n="analytics.sum.avg"></div><div class="sub" data-i18n="analytics.sum.avg_sub"></div></div>
      </div>

      <div class="chart-grid">
        <article class="card chart-card wide">
          <h3 data-i18n="analytics.chart.monthly"></h3>
          <p class="chart-sub">
            <span data-i18n="analytics.chart.monthly_sub"></span>
            <a href="about.html#limitations" data-i18n="banner.learn"></a>。
          </p>
          <div class="chart-box tall"><canvas id="chart-monthly" role="img" aria-label="" data-i18n-aria="analytics.chart.monthly"></canvas></div>
        </article>
        <article class="card chart-card">
          <h3 data-i18n="analytics.chart.district"></h3>
          <p class="chart-sub" data-i18n="analytics.chart.district_sub"></p>
          <div class="chart-box"><canvas id="chart-district" role="img" aria-label="" data-i18n-aria="analytics.chart.district"></canvas></div>
        </article>
        <article class="card chart-card">
          <h3 data-i18n="analytics.chart.bands"></h3>
          <p class="chart-sub" data-i18n="analytics.chart.bands_sub"></p>
          <div class="chart-box"><canvas id="chart-bands" role="img" aria-label="" data-i18n-aria="analytics.chart.bands"></canvas></div>
        </article>
        <article class="card chart-card wide">
          <h3 data-i18n="analytics.chart.top"></h3>
          <p class="chart-sub" data-i18n="analytics.chart.top_sub"></p>
          <div class="chart-box"><canvas id="chart-top-locations" role="img" aria-label="" data-i18n-aria="analytics.chart.top"></canvas></div>
        </article>
      </div>

      <section class="section" style="padding-bottom: 0;" aria-labelledby="district-table-title">
        <div class="section-head">
          <h2 id="district-table-title" style="font-size: 1.3rem;" data-i18n="analytics.table.district"></h2>
          <p data-i18n="analytics.table.district_sub"></p>
        </div>
        <div class="card table-wrap">
          <table class="data-table" data-district-table>
            <thead>
              <tr>
                <th data-i18n="analytics.th.district"></th>
                <th class="num" data-i18n="analytics.th.actions"></th>
                <th class="num" data-i18n="analytics.th.boars"></th>
                <th class="num" data-i18n="analytics.th.locations"></th>
                <th data-i18n="analytics.th.share"></th>
                <th data-i18n="analytics.th.view"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="section" style="padding-bottom: 0;" aria-labelledby="location-table-title">
        <div class="section-head">
          <h2 id="location-table-title" style="font-size: 1.3rem;" data-i18n="analytics.table.location"></h2>
          <p>
            <span data-i18n="analytics.table.location_sub"></span>
            <strong data-i18n="analytics.table.location_sub_strong"></strong>。
          </p>
        </div>
        <div class="card table-wrap">
          <table class="data-table" data-location-table>
            <thead>
              <tr>
                <th data-i18n="analytics.th.location"></th>
                <th data-i18n="analytics.th.district"></th>
                <th class="num" data-i18n="analytics.th.recordcount"></th>
                <th class="num" data-i18n="analytics.th.boars"></th>
                <th class="num" data-i18n="analytics.th.last"></th>
                <th data-i18n="analytics.th.activity"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p style="font-size: 0.85rem; color: var(--c-ink-faint); margin-top: 10px;">
          <span data-i18n="analytics.indicator_link"></span>
          <a href="about.html#indicator" data-i18n="analytics.indicator_link_target"></a>。
        </p>
      </section>
